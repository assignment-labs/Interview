name: Deploy MERN App to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: <YOUR_REGISTRY>.azurecr.io
          username: ${{ secrets.AZURE_CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_CONTAINER_REGISTRY_PASSWORD }}

      - name: Build and push image to ACR
        run: |
          docker build -t <YOUR_REGISTRY>.azurecr.io/mern-app:latest .
          docker push <YOUR_REGISTRY>.azurecr.io/mern-app:latest

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: <YOUR_WEBAPP_NAME>
          images: <YOUR_REGISTRY>.azurecr.io/mern-app:latest
